# OpenPlayer layout for the uosc on-screen controls ("Black Gold Aurora" glass).
# Colors and opacity are set per theme by OpenPlayer (View > Theme).
# Filled progress bar: elapsed part in the theme accent color, rest dimmed.
timeline_style=bar
timeline_line_width=4
timeline_size=30
timeline_border=1
# Controls stay on screen in a window; in fullscreen they show on mouse move or when paused.
timeline_persistency=paused,audio,idle,windowed
controls_persistency=paused,audio,idle,windowed
# Slim volume slider: appears when the mouse is near the left edge or the volume changes.
volume_persistency=
# No leftover progress line in fullscreen: the full bar shows on mouse move and hides again.
progress=never
progress_size=4
progress_line_width=4
top_bar=never
window_border_size=0
# Mockup order: menu | tracks ... prev, -10, PLAY, +10, next ... speed, playlist, fullscreen
# The control bar (with translated tooltips) is set by OpenPlayer at start-up.
controls=command:menu:script-message openplayer-panel menu?Menu,gap,command:volume_up:script-message openplayer-volume?Volume (click again to mute),command:graphic_eq:script-message openplayer-eq?Equalizer,gap,<has_sub>command:subtitles:script-message openplayer-panel menu subtitles?Subtitles,<has_many_audio>command:audiotrack:script-message openplayer-panel menu audio?Audio track,space,command:skip_previous:playlist-prev?Previous,command:replay_10:seek -10?Back 10 seconds,cycle:pause:pause:no=pause!/yes=play_arrow!?Play / Pause,command:forward_10:seek 10?Forward 10 seconds,command:skip_next:playlist-next?Next,space,<video,audio>speed:1,command:playlist_play:script-message openplayer-panel playlist?Playlist,fullscreen
controls_size=40
controls_margin=12
controls_spacing=6
volume=left
volume_size=30
volume_border=0
volume_step=5
border_radius=14
color=foreground=f5b942,foreground_text=1a1206,background=120d07,background_text=f6ead4,curtain=0b0805,success=d9c27a,error=ff7a6b,match=ffcf6b,heatmap=f5b942,window_border=000000
opacity=timeline=0.78,position=1,chapters=0.7,slider=0.85,slider_gauge=1,controls=0,speed=0.6,menu=0.86,submenu=0.5,tooltip=0.92,curtain=0.75,idle_indicator=0.85,pause_indicator=0.85,playlist_position=0.85,thumbnail=1
text_border=1.4
font_scale=1.05
scale_fullscreen=1.25
animation_duration=140
pause_indicator=flash
menu_type_to_search=yes
languages=~~/openplayer-text.json,slang,en
flash_duration=3000
