# OpenPlayer key bindings (added on top of mpv's defaults)
MBTN_RIGHT     script-message openplayer-menu
WHEEL_UP       add volume 5
WHEEL_DOWN     add volume -5
ctrl+p         script-message openplayer-panel playlist
ctrl+m         script-message openplayer-panel menu
menu           script-binding uosc/menu
f              script-message openplayer-fs
F11            script-message openplayer-fs
MBTN_LEFT      script-message openplayer-click
MBTN_LEFT_DBL  ignore
ESC            script-message openplayer-fs-exit
ctrl+o         script-message openplayer-open
ctrl+e         script-message openplayer-eq
ctrl+,         script-message openplayer-options
ctrl+s         script-message openplayer-savepl
ctrl+l         script-message openplayer-loadpl
