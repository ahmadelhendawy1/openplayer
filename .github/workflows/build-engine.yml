# DRAFT — NOT YET RUN. Builds the LGPL engine pack (FFmpeg + libass + dav1d +
# libmpv) from upstream source tags, gates the licenses, signs a manifest and
# publishes it. Expect to fix build details on the first real run.
name: build-engine
on:
  workflow_dispatch:
    inputs:
      serial:   { description: "Release serial (must increase every release)", required: true }
      version:  { description: "Engine version label, e.g. 2026.11.1", required: true }
      ffmpeg_tag: { description: "FFmpeg tag", default: "n7.1.1" }
      mpv_tag:    { description: "mpv tag",    default: "v0.40.0" }

jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { shell: msys2 {0}, working-directory: windows } }
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make diffutils pkgconf nasm yasm
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-dav1d
            mingw-w64-ucrt-x86_64-libass mingw-w64-ucrt-x86_64-libplacebo
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }

      - name: Build FFmpeg (LGPL, shared, no GPL/non-free flags)
        run: |
          git clone --depth 1 --branch "${{ inputs.ffmpeg_tag }}" https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cd ffmpeg
          ./configure --prefix=/ucrt64 --enable-shared --disable-static \
            --disable-programs --disable-doc --disable-debug \
            --enable-libdav1d --enable-d3d11va --enable-dxva2
          make -j"$(nproc)" && make install

      - name: Build libmpv (LGPL, no player, no IPTV/network extras)
        run: |
          git clone --depth 1 --branch "${{ inputs.mpv_tag }}" https://github.com/mpv-player/mpv.git mpv
          cd mpv
          meson setup build -Dlibmpv=true -Dcplayer=false -Dgpl=false \
            -Dlua=disabled -Djavascript=disabled -Dcdda=disabled -Ddvdnav=disabled
          ninja -C build

      - name: Collect DLLs and license texts
        run: |
          mkdir -p dist
          cp mpv/build/libmpv-2.dll dist/
          cp /ucrt64/bin/{avcodec,avformat,avutil,avfilter,swresample,swscale}-*.dll dist/
          cp /ucrt64/bin/{libass,libdav1d,libplacebo}*.dll dist/ || true
          # TODO: also copy runtime DLLs these depend on (use ldd) and add LICENSE texts as .txt

      - name: License gate
        run: scripts/license-gate.sh dist

      - name: Pack and sign
        env: { ENGINE_SIGNING_KEY: "${{ secrets.ENGINE_SIGNING_KEY }}" }
        run: |
          echo "$ENGINE_SIGNING_KEY" > release.key
          go run ./cmd/enginectl pack --in dist --out release --spec build/spec.json \
            --serial "${{ inputs.serial }}" --version "${{ inputs.version }}" --key release.key
          rm -f release.key

      - uses: actions/upload-artifact@v4
        with: { name: engine-release, path: release }
